name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test
        working-directory: microservices/user-service
        run: mvn clean verify

      - name: Build package
        working-directory: microservices/user-service
        run: mvn package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service
          path: microservices/user-service/target/*.jar
