name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build & Test
      run: mvn clean verify
      working-directory: microservices/user-service

    - name: Deploy to Nexus (Maven)
      run: mvn deploy
      working-directory: microservices/user-service
      env:
        MAVEN_USERNAME: admin
        MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    - name: Build Docker image
      run: docker build -t localhost:2323/my-web-app:${{ github.sha }} .

    - name: Login to Nexus Docker
      run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login localhost:4242 -u admin --password-stdin

    - name: Push Docker image
      run: docker push localhost:5001/my-web-app:${{ github.sha }}
